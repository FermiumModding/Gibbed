modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="https://github.com/FermiumModding/Gibbed/issues" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/gibbed" #optional (displayed in the mod UI)
logoFile="icon.png" #optional
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
displayTest = "IGNORE_ALL_VERSION" # Clientside only
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.citadel.mixins.json"
[[mixins]]
config = "${mod_id}.geckolib.mixins.json"
[[mixins]]
config = "${mod_id}.azurelib.mixins.json"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[21.1,)" #mandatory
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "[${cloth_version},)"
ordering = "NONE"
side = "CLIENT"